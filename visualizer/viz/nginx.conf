server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # rag-engine is resolved by Docker's DNS inside the rag-net network
    location /api/ {
        proxy_pass http://rag-engine:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;   # first answer loads Qwen3 on CPU
    }
}
